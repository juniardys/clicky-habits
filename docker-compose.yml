services:
  prisma-migration:
    build:
      context: .
      dockerfile: docker/api-db.Dockerfile
    image: clicky-habits-migration:latest
    container_name: clicky-habits-migration
    restart: unless-stopped
    env_file:
      - .env
    # Applies migrations on start, then stays alive for manual db operations
    # (e.g. `docker exec -it clicky-habits-migration bunx prisma studio`).
    command: ["migrate"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/migrations-complete"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: clicky-habits-api:latest
    # Also the hostname the web container proxies /api to (API_UPSTREAM).
    container_name: clicky-habits-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      prisma-migration:
        condition: service_healthy
    ports:
      # Host port for api.<domain> (subdomain mode). Optional in single-domain mode.
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Baked into the SPA at build time. Empty = same-origin /api via nginx.
        VITE_API_URL: ${VITE_API_URL:-}
    image: clicky-habits-web:latest
    container_name: clicky-habits-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://clicky-habits-api:3001
    ports:
      # Host port for the main domain
      - "${APP_PORT:-3000}:80"
