services:
  prisma-migration:
    build:
      context: .
      dockerfile: docker/api-db.Dockerfile
    image: clicky-habits-migration:latest
    container_name: clicky-habits-migration
    restart: unless-stopped
    env_file:
      - .env
    # Applies migrations on start, then stays alive for manual db operations
    # (e.g. `docker exec -it clicky-habits-migration bunx prisma studio`).
    command: ["migrate"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/migrations-complete"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: clicky-habits-api:latest
    container_name: clicky-habits-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      prisma-migration:
        condition: service_healthy
    # No host ports: the reverse proxy (Dokploy's Traefik) reaches this
    # container over the Docker network. Route api.<domain> -> api:3001.
    # For local Docker testing use docker-compose.local.yml.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Baked into the SPA at build time. Required in production:
        # the web container has no route to the API.
        VITE_API_URL: ${VITE_API_URL:-}
    image: clicky-habits-web:latest
    container_name: clicky-habits-web
    restart: unless-stopped
    # No host ports: route <domain> -> web:80 in the reverse proxy.
