# Local Docker testing only. Publishes host ports that production does not
# need (there the reverse proxy reaches containers over the Docker network).
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Matching .env for this setup:
#   BETTER_AUTH_URL="http://localhost:3001"
#   VITE_API_URL="http://localhost:3001"
#   TRUSTED_ORIGINS="http://localhost:3000"

services:
  api:
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    ports:
      - "${APP_PORT:-3000}:80"
